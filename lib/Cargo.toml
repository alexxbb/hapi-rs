[package]
name = "hapi-rs"
description = "Rust bindings to Houdini Engine API"
documentation = "https://docs.rs/hapi-rs"
repository = "https://github.com/alexxbb/hapi-rs/"
keywords = ["vfx", "graphics", "gamedev", "houdini"]
categories = [
    "graphics",
    "game-development",
    "rendering",
    "simulation",
    "api-bindings",
]
readme = "../README.md"
version = "22.0.0"
authors = ["Aleksei Rusev <hou.alexx@gmail.com>"]
edition = "2024"
license = "MIT"
include = ["/src", "build.rs", "LICENSE"]

[dependencies]
log = "0.4.28"
pastey = "0.1.1"
parking_lot = "0.12.5"
debug-ignore = "1.0.5"
tempfile = "3.23.0"
thiserror = "2.0"
temp-env = "0.3.6"
bytecount = "0.6.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
env_logger = "0.11.8"
pastey = "0.1.1"
pretty_assertions = "1.4.1"
prettytable-rs = "0.10.0"
fastrand = "2.3.0"
anyhow = "1.0.100"
argh = "0.1.13"
ctrlc = "3.5.0"
tinyjson = "2.5.1"

[features]
async-cooking = []
